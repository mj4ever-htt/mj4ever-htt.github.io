<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MJ Trader Pro</title>
<style>
body{font-family:Arial,sans-serif;max-width:800px;margin:auto;padding:20px}
.card{border:1px solid #ccc;border-radius:8px;padding:15px;margin:10px 0}
button,input{padding:8px;width:100%;margin:5px 0}
</style>
</head>
<body>
<h1>MJ Trader Pro</h1>
<p>Trading journal and risk management tool for forex traders.</p>

<div class="card">
<h2>Risk Calculator</h2>
<input id="bal" type="number" value="1000" placeholder="Balance">
<input id="risk" type="number" value="1" placeholder="Risk %">
<button onclick="calc()">Calculate</button>
<p id="out"></p>
</div>

<script>
function calc(){
 let b=+document.getElementById('bal').value;
 let r=+document.getElementById('risk').value;
 let riskAmount=b*r/100;
 document.getElementById('out').innerHTML="Risk Amount: $"+riskAmount.toFixed(2);
}
</script>
</body>
</html>
