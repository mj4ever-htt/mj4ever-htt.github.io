<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MJ Trader Pro</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

h1{
margin-top:0;
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
}

button{
background:#22c55e;
color:white;
font-weight:bold;
}

.stat{
font-size:28px;
font-weight:bold;
}

.small{
color:#94a3b8;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h1>MJ Trader Pro</h1>
<p class="small">Trading Journal & Risk Management Dashboard</p>
</div>

<div class="card">
<h2>Account Overview</h2>

<div class="stat">$1000</div>
<p class="small">Demo Account Balance</p>

<div class="stat">1%</div>
<p class="small">Risk Per Trade</p>
</div>

<div class="card">
<h2>Risk Calculator</h2>

<input id="balance" type="number" placeholder="Account Balance" value="1000">

<input id="risk" type="number" placeholder="Risk %" value="1">

<button onclick="calc()">Calculate Risk</button>

<p id="result"></p>
</div>

<div class="card">
<h2>Coming Soon</h2>

<ul>
<li>Trade Journal</li>
<li>Win Rate Tracking</li>
<li>Equity Curve</li>
<li>Trade Statistics</li>
<li>Installable Mobile App</li>
</ul>
</div>

</div>

<script>
function calc(){
let balance =
parseFloat(document.getElementById("balance").value);

let risk =
parseFloat(document.getElementById("risk").value);

let riskAmount =
(balance*risk)/100;

document.getElementById("result").innerHTML =
"Risk Amount: $" + riskAmount.toFixed(2);
}
</script>

</body>
</html>
